<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Applies the saved theme (data-theme, data-dark, theme-color) before first paint: a
         classic blocking script on purpose, external so a CSP never needs 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
    <!-- use-credentials: behind Cloudflare Access the manifest request needs the Access cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />
    <title>Flashcards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
